<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Around the world by bicycle</title>
<meta name="description" content="Live tracker: where the ride is right now, the road so far, kilometres cycled and days on the road.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%232b6fd6'/%3E%3C/svg%3E">
<script>try{var d=document.documentElement.dataset;d.theme=localStorage.getItem("theme")||"light";d.view=localStorage.getItem("view")||"earth"}catch(e){document.documentElement.dataset.theme="light";document.documentElement.dataset.view="earth"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=202609251834">
</head>
<body>
<div id="map" aria-label="Map of the route"></div>

<header class="brand">
  <p class="eyebrow" id="title">Around the world by bicycle</p>
  <h1 id="rider">&nbsp;</h1>
</header>

<aside class="panel" aria-live="polite">
  <div class="stats">
    <div class="stat">
      <span class="num" id="km">—</span>
      <span class="label">kilometres cycled</span>
    </div>
    <div class="stat">
      <span class="num" id="days">—</span>
      <span class="label">days on the road</span>
    </div>
  </div>
  <button class="last" id="locate" type="button" title="Show latest position">
    <span class="dot" aria-hidden="true"></span>
    <span id="last">Waiting for the first fix…</span>
  </button>
  <div class="sponsor-stats" id="sponsor-stats" hidden>
    <div class="mini">
      <svg class="bottle" viewBox="0 0 14 28" aria-hidden="true"><clipPath id="bottle-clip"><path d="M4 1h6v3.5l2 3V25a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7.5l2-3z"/></clipPath><rect class="water" id="bottle-fill" x="0" y="27" width="14" height="27" clip-path="url(#bottle-clip)"/><path class="glass" d="M4 1h6v3.5l2 3V25a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7.5l2-3z"/></svg>
      <div><span class="mini-num" id="litres">—</span><span class="mini-label" id="litres-label"></span></div>
    </div>
    <div class="mini">
      <svg class="signal" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="15" width="3" height="6" rx="1"/><rect x="8.5" y="11" width="3" height="10" rx="1"/><rect x="14" y="7" width="3" height="14" rx="1"/><rect x="19.5" y="3" width="3" height="18" rx="1"/></svg>
      <div><span class="mini-num" id="gb">—</span><span class="mini-label" id="gb-label"></span></div>
    </div>
  </div>
  <p class="meta" id="meta"></p>
  <p class="meta links" id="links"></p>
</aside>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="js/app.js?v=202609251834"></script>
</body>
</html>
