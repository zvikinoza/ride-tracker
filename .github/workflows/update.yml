name: Update track

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may run it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-track
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new points (Strava or MapShare, per config.json)
        run: python scripts/fetch.py
        env:
          MAPSHARE_PASSWORD: ${{ secrets.MAPSHARE_PASSWORD }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "track-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No new points (or MapShare not configured yet)."
          else
            git commit -m "Track update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
