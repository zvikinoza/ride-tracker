name: Update track

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may run it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-track
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new points from MapShare
        run: python scripts/fetch_track.py
        env:
          MAPSHARE_PASSWORD: ${{ secrets.MAPSHARE_PASSWORD }}

      - name: Commit if anything changed
        run: |
          git config user.name "track-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/track.json data/summary.json
          if git diff --staged --quiet; then
            echo "No new points."
          else
            git commit -m "Track update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
